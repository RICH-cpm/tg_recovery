<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark light">
    <title>{% block title %}TG Recovery{% endblock %}</title>
    {# Тему ставим до первой отрисовки, иначе на секунду мигает чужой фон. #}
    <script>(function(){var t;try{t=localStorage.getItem('theme');}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.setAttribute('data-theme',t);var l;try{l=localStorage.getItem('lang');}catch(e){}document.documentElement.setAttribute('data-lang',(l==='en')?'en':'ru');})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
</head>
<body>
    <div class="ambient" aria-hidden="true">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
        <div class="ambient-scrim"></div>
        <div class="ambient-noise"></div>
    </div>

    {% block layout %}{% endblock %}

    <script src="{{ static_url('js/i18n.js') }}"></script>
    <script src="{{ static_url('js/theme.js') }}"></script>
    <script src="{{ static_url('js/time.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
