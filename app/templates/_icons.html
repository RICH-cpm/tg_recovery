{# Иконки одним набором, чтобы svg не расползался по шаблонам. #}
{% macro ico(name, size=18, stroke=1.7) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ stroke }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'shield' %}<path d="M12 3l7 3v5c0 4.6-3.1 7.8-7 9-3.9-1.2-7-4.4-7-9V6z"></path><path d="M9 11.8l2 2 4-4"></path>
{%- elif name == 'shield-plus' %}<path d="M12 3l7 3v5c0 4.6-3.1 7.8-7 9-3.9-1.2-7-4.4-7-9V6z"></path><path d="M12 8v6M9 11h6"></path>
{%- elif name == 'grid' %}<rect x="3" y="3" width="8" height="8" rx="2"></rect><rect x="13" y="3" width="8" height="8" rx="2"></rect><rect x="3" y="13" width="8" height="8" rx="2"></rect><rect x="13" y="13" width="8" height="8" rx="2"></rect>
{%- elif name == 'clock' %}<circle cx="12" cy="12" r="9"></circle><path d="M12 8v4l2.5 1.5"></path>
{%- elif name == 'gear' %}<circle cx="12" cy="12" r="3"></circle><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
{%- elif name == 'exit' %}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path>
{%- elif name == 'sun' %}<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
{%- elif name == 'moon' %}<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
{%- elif name == 'search' %}<circle cx="11" cy="11" r="7"></circle><path d="M21 21l-3.6-3.6"></path>
{%- elif name == 'plus' %}<path d="M12 5v14M5 12h14"></path>
{%- elif name == 'card' %}<rect x="3" y="4" width="18" height="14" rx="2"></rect><path d="M3 9h18"></path>
{%- elif name == 'mail' %}<rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path>
{%- elif name == 'lock' %}<rect x="4" y="10" width="16" height="11" rx="2.5"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
{%- elif name == 'arrow-left' %}<path d="M19 12H5M12 19l-7-7 7-7"></path>
{%- elif name == 'refresh' %}<path d="M21 2v6h-6M3 22v-6h6"></path><path d="M21 8a9 9 0 0 0-15-3L3 8M3 16a9 9 0 0 0 15 3l3-3"></path>
{%- elif name == 'trash' %}<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
{%- elif name == 'chevron' %}<path d="M6 9l6 6 6-6"></path>
{%- elif name == 'check' %}<path d="M20 6L9 17l-5-5"></path>
{%- elif name == 'home' %}<path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path>
{%- elif name == 'save' %}<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><path d="M17 21v-8H7v8M7 3v5h8"></path>
{%- elif name == 'users' %}<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
{%- elif name == 'key' %}<circle cx="7.5" cy="15.5" r="4.5"></circle><path d="M10.7 12.3L21 2M17 6l3 3M14 9l3 3"></path>
{%- endif -%}
</svg>
{%- endmacro %}
